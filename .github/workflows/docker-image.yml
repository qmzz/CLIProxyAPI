name: docker-image

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  packages: write

env:
  APP_NAME: CLIProxyAPI
  REGISTRY: ghcr.io

jobs:
  docker_amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test auth cooldown routing
        run: >-
          go test ./sdk/cliproxy/auth -run
          '^(TestCooldownBlocksHonorsQuotaRecoverWindow|TestIsAuthBlockedForModelFallsBackToAuthQuota|TestFillFirstSelectorPick_FallsBackToAuthCooldownForUnmappedRoute|TestRetryAfterFromErrorUnwrapsWrappedStatus|TestManager_MarkResult_XAIErrorDisablesCredentialFor24h|TestManager_MarkResult_XAIErrorRespectsDisableCooling|TestPreserveAuthLevelRuntimeCooldown_KeepsXAI24hAcrossReload|TestManager_MarkResult_EmptyStreamDisablesXAIFor24h|TestIsEmptyStreamError|TestManager_Update_PreservesCooldownAcrossAuthFileReload|TestManager_List_RevivesExpiredXAIAutoDisable|TestManager_Update_XAIExplicitManualEnableClearsAutoDisable|TestManager_SelectAuth_RevivesExpiredXAIAutoDisable)$'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Build Metadata
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo COMMIT=`git rev-parse --short HEAD` >> $GITHUB_ENV
          echo BUILD_DATE=`date -u +%Y-%m-%dT%H:%M:%SZ` >> $GITHUB_ENV
          echo "IMAGE_NAME=$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
